
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber World</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
                url("image/brownie.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #E8D5B5;
            font-family: Georgia, serif;
        }

        /* NAVIGATION */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 7%;

            border-bottom: 1px solid rgba(201,166,107,0.4);
        }

        .logo {
            letter-spacing: 4px;
            font-size: 16px;
            color: #C9A66B;
        }

        nav a {
            color: #E8D5B5;
            text-decoration: none;
            margin-left: 30px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #C9A66B;
        }

        /* HAUPTINHALT */

        main {
            text-align: center;
            padding: 120px 20px;
        }

        .welcome {
            color: #C9A66B;
            letter-spacing: 6px;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 65px);
            letter-spacing: 4px;
            margin: 25px 0;
        }

        .description {
            color: #D8C3A5;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
            line-height: 2;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px;
            color: #A68B69;
            font-size: 11px;
            letter-spacing: 3px;
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin: 0 8px;
            }

            main {
                padding-top: 90px;
            }
        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            CYBER WORLD
        </div>

        <nav>
            <a href="world.html">HOME</a>
            <a href="about.html">ABOUT</a>
           <a href="explore.html">EXPLORE</a>
        </nav>

    </header>


    <main>

        <div class="welcome">
            SYSTEM ACCESS GRANTED
        </div>

        <h1>WELCOME TO MY WORLD</h1>

        <p class="description">
            A DIFFERENT DIMENSION.<br>
            A DIFFERENT EXPERIENCE.
        </p>

    </main>


    <footer>
        ● SYSTEM ONLINE
    </footer>

</body>
</html>
